name: CI

on:
  pull_request:
    branches:
      - beta
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify formatting
        run: docker buildx build --target format --progress=plain .

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: docker buildx build --target build --progress=plain .
      - name: Test
        run: docker buildx build --target test --progress=plain .
